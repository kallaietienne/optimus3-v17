name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Függőségek
        run: npm install

      - name: Ikon és indítókép mappába rendezése
        run: |
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png splash.png assets/
          cp splash.png assets/splash-dark.png

      - name: Web mappa előkészítése
        run: npm run prepare:web

      - name: Android projekt létrehozása
        run: npx cap add android

      - name: Engedélyek (névjegyek, kamera) az Android manifestbe
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="android.permission.CAMERA" />' $MF
          grep -n "uses-permission" $MF

      - name: Ikonok generálása
        run: npm run assets

      - name: Web build + sync
        run: npm run sync

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi

      - name: Aláírás (release, ha van keystore secret)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > optimus3.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks optimus3.keystore \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out Optimus3-release.apk aligned.apk
          rm -f optimus3.keystore

      - name: Debug APK összegyűjtése
        if: env.HAS_KEYSTORE != 'true'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Optimus3-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Optimus3-APK
          path: Optimus3-*.apk
